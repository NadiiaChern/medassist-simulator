<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relevo Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #ffffff;
  --navy2: #f7f5ff;
  --navy3: #f0ecfb;
  --panel: #faf9ff;
  --card: #ffffff;
  --border: rgba(91,45,142,0.10);
  --teal: #5B2D8E;
  --teal2: #4a2275;
  --blue: #5B2D8E;
  --blue2: #4a2275;
  --red: #F4694A;
  --amber: #e8a020;
  --green: #1db870;
  --white: #1a0a2e;
  --muted: #7a6a8a;
  --muted2: #a090b0;
  --text: #2d1a44;
  --radius: 12px;
  --radius-sm: 8px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--navy);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── LOGIN ─────────────────────────────────────────── */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, #ede5f5 0%, #f8f5ff 70%);
  position: relative;
  overflow: hidden;
}
#login-screen::before {
  content:'';
  position:absolute;
  width:600px; height:600px;
  border-radius:50%;
  background: radial-gradient(circle, rgba(91,45,142,0.08) 0%, transparent 70%);
  top:-200px; left:50%; transform:translateX(-50%);
}

.login-box {
  width: 400px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px;
  position: relative;
  z-index:1;
  box-shadow: 0 40px 80px rgba(91,45,142,0.12);
}

.login-logo {
  display: flex; align-items:center; gap:10px;
  margin-bottom: 32px;
}
.login-logo-dot {
  width:10px; height:10px; border-radius:50%;
  background: var(--teal);
  box-shadow: 0 0 12px rgba(91,45,142,0.5);
}
.login-logo span { font-size:20px; font-weight:600; color:var(--white); letter-spacing:-0.5px; }

.login-title { font-size:24px; font-weight:600; color:var(--white); margin-bottom:8px; }
.login-sub { font-size:13px; color:var(--muted); margin-bottom:28px; }

.role-tabs {
  display:flex; gap:8px; margin-bottom:24px;
}
.role-tab {
  flex:1; padding:10px; border-radius:var(--radius-sm);
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size:13px; font-weight:500;
  cursor:pointer; transition:all .2s;
}
.role-tab.active {
  background: var(--teal);
  border-color: var(--teal);
  color: #ffffff;
  font-weight:600;
}

.form-group { margin-bottom:16px; }
.form-label { font-size:12px; color:var(--muted); margin-bottom:6px; display:block; font-weight:500; letter-spacing:0.5px; text-transform:uppercase; }
.form-input {
  width:100%; padding:12px 14px;
  background: #f8f6fc;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size:14px;
  transition: border-color .2s;
  outline:none;
}
.form-input:focus { border-color: rgba(91,45,142,0.4); }

.btn-primary {
  width:100%; padding:13px;
  background: var(--teal);
  border:none; border-radius: var(--radius-sm);
  color: #ffffff;
  font-family:'DM Sans',sans-serif;
  font-size:15px; font-weight:600;
  cursor:pointer; margin-top:8px;
  transition: all .2s;
}
.btn-primary:hover { background:var(--teal2); transform:translateY(-1px); }

.login-demo { margin-top:20px; padding-top:20px; border-top:1px solid var(--border); }
.demo-label { font-size:11px; color:var(--muted2); margin-bottom:10px; text-transform:uppercase; letter-spacing:0.5px; }
.demo-btns { display:flex; gap:8px; }
.demo-btn {
  flex:1; padding:9px;
  background: var(--navy3);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--muted);
  font-family:'DM Sans',sans-serif;
  font-size:12px; cursor:pointer;
  transition:all .2s;
}
.demo-btn:hover { border-color:rgba(91,45,142,0.3); color:var(--teal); }

/* ── APP SHELL ─────────────────────────────────────── */
#app { display:none; height:100vh; flex-direction:row; }

/* SIDEBAR */
.sidebar {
  width: 240px;
  min-width: 240px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  box-shadow: 2px 0 12px rgba(91,45,142,0.06);
  display:flex; flex-direction:column;
  padding: 0;
  overflow: hidden;
}

.sidebar-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-logo { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.sidebar-logo-dot { width:8px; height:8px; border-radius:50%; background:var(--teal); box-shadow:0 0 8px rgba(91,45,142,0.4); }
.sidebar-logo-text { font-size:16px; font-weight:600; color:var(--white); }

.sidebar-user {
  display:flex; align-items:center; gap:10px;
  padding: 10px 12px;
  background: var(--card);
  border-radius: var(--radius-sm);
}
.sidebar-avatar {
  width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:var(--navy);
  flex-shrink:0;
}
.sidebar-user-info { overflow:hidden; }
.sidebar-user-name { font-size:13px; font-weight:600; color:var(--white); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sidebar-user-role { font-size:11px; color:var(--muted); }

.sidebar-nav { flex:1; padding:12px 12px; overflow-y:auto; }
.nav-section { margin-bottom:20px; }
.nav-section-label { font-size:10px; font-weight:600; color:var(--muted2); letter-spacing:1px; text-transform:uppercase; padding: 0 8px; margin-bottom:6px; }
.nav-item {
  display:flex; align-items:center; gap:10px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  cursor:pointer; transition:all .2s;
  font-size:13px; font-weight:500; color:var(--muted);
  border:none; background:transparent; width:100%; text-align:left;
}
.nav-item:hover { background:var(--card); color:var(--text); }
.nav-item.active { background:rgba(91,45,142,0.08); color:var(--teal); }
.nav-item svg { width:16px; height:16px; flex-shrink:0; }
.nav-badge { margin-left:auto; background:var(--red); color:white; font-size:10px; font-weight:700; padding:2px 6px; border-radius:20px; }

.sidebar-footer {
  padding:12px; border-top:1px solid var(--border);
}
.badge-hds {
  display:flex; align-items:center; gap:6px;
  padding:8px 10px;
  background: rgba(91,45,142,0.06);
  border:1px solid rgba(91,45,142,0.15);
  border-radius:6px;
  font-size:11px; color:#5B2D8E; font-weight:600;
}

/* MAIN */
.main {
  flex:1; display:flex; flex-direction:column; overflow:hidden;
}

.topbar {
  height:56px; flex-shrink:0;
  background:#ffffff;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 24px;
  gap:16px;
}
.topbar-title { font-size:15px; font-weight:700; color:#1a0a2e; flex:1; }
.topbar-badge {
  padding:5px 12px; border-radius:20px;
  font-size:11px; font-weight:600;
}
.topbar-badge.recording { background:rgba(255,90,90,0.15); color:var(--red); border:1px solid rgba(255,90,90,0.3); display:flex; align-items:center; gap:5px; }
.topbar-badge.recording::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--red); animation:pulse 1.5s infinite; }
.topbar-btn {
  padding:7px 14px; border-radius:6px;
  border:1px solid var(--border);
  background:transparent; color:var(--muted);
  font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500;
  cursor:pointer; transition:all .2s;
}
.topbar-btn:hover { border-color:rgba(91,45,142,0.3); color:var(--teal); }
.topbar-btn.primary { background:var(--teal); border-color:var(--teal); color:#ffffff; font-weight:600; }
.topbar-btn.primary:hover { background:var(--teal2); color:#ffffff; }

.content { flex:1; overflow-y:auto; padding:24px; background:#f7f5ff; }

/* PAGES */
.page { display:none; animation: fadeIn .25s ease; }
.page.active { display:block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

/* ── GRID / STATS ──────────────────────────────────── */
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
.stat-card {
  background:#ffffff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 20px;
  transition:border-color .2s;
  box-shadow: 0 1px 8px rgba(91,45,142,0.05);
}
.stat-card:hover { border-color:rgba(91,45,142,0.2); }
.stat-label { font-size:11px; color:var(--muted); font-weight:500; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
.stat-value { font-size:28px; font-weight:600; color:var(--white); line-height:1; margin-bottom:4px; font-family:'DM Mono',monospace; }
.stat-value.teal { color:var(--teal); }
.stat-value.red { color:var(--red); }
.stat-value.amber { color:var(--amber); }
.stat-sub { font-size:11px; color:var(--muted); }

/* ── CARDS ─────────────────────────────────────────── */
.card {
  background:#ffffff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow: 0 1px 8px rgba(91,45,142,0.06);
}
.card-header {
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.card-title { font-size:13px; font-weight:600; color:var(--white); }
.card-body { padding:0; }

/* ── APPOINTMENT LIST ──────────────────────────────── */
.appt-row {
  display:flex; align-items:center; gap:14px;
  padding:13px 20px;
  border-bottom:1px solid var(--border);
  transition:background .2s; cursor:pointer;
}
.appt-row:last-child { border-bottom:none; }
.appt-row:hover { background:rgba(91,45,142,0.03); }
.appt-avatar {
  width:36px; height:36px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:white; flex-shrink:0;
}
.appt-info { flex:1; }
.appt-name { font-size:13px; font-weight:600; color:var(--white); }
.appt-detail { font-size:11px; color:var(--muted); margin-top:1px; }
.appt-time { font-family:'DM Mono',monospace; font-size:12px; color:var(--muted); }
.status-pill {
  padding:3px 10px; border-radius:20px;
  font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
}
.status-now { background:rgba(62,142,255,0.15); color:var(--blue); border:1px solid rgba(62,142,255,0.3); }
.status-waiting { background:rgba(255,181,71,0.12); color:var(--amber); border:1px solid rgba(255,181,71,0.25); }
.status-done { background:rgba(46,216,138,0.1); color:var(--green); border:1px solid rgba(46,216,138,0.2); }

/* ── TWO-COL ───────────────────────────────────────── */
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
.three-col { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:14px; }

/* ── AI CHAT ───────────────────────────────────────── */
.ai-page { display:grid; grid-template-rows:1fr auto; height:calc(100vh - 56px - 48px); }
.chat-messages {
  overflow-y:auto; padding:20px;
  display:flex; flex-direction:column; gap:16px;
}
.msg { display:flex; gap:12px; max-width:75%; }
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
.msg-bubble {
  padding:12px 16px;
  border-radius:14px;
  font-size:13px; line-height:1.6;
}
.msg.assistant .msg-bubble { background:#f0ecfb; border:1px solid var(--border); color:var(--text); border-radius:4px 14px 14px 14px; }
.msg.user .msg-bubble { background:var(--teal); color:#ffffff; font-weight:500; border-radius:14px 4px 14px 14px; }
.msg-avatar { width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; margin-top:2px; }
.msg-time { font-size:10px; color:var(--muted); margin-top:4px; }

.chat-input-area {
  padding:16px 20px;
  border-top:1px solid var(--border);
  background:#ffffff;
}
.chat-input-row { display:flex; gap:10px; align-items:flex-end; }
.chat-textarea {
  flex:1; resize:none;
  background:#f8f6fc;
  border:1px solid var(--border);
  border-radius: var(--radius-sm);
  color:var(--white);
  font-family:'DM Sans',sans-serif;
  font-size:13px; padding:12px 14px;
  max-height:100px; min-height:44px;
  outline:none; transition:border-color .2s;
}
.chat-textarea:focus { border-color:rgba(91,45,142,0.35); }
.chat-send {
  width:44px; height:44px; border-radius:var(--radius-sm);
  background:var(--teal); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .2s; flex-shrink:0;
}
.chat-send:hover { background:var(--teal2); }
.chat-send svg { width:18px; height:18px; color:#ffffff; }
.chat-quick { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.quick-btn {
  padding:6px 12px; border-radius:20px;
  border:1px solid var(--border);
  background:transparent; color:var(--muted);
  font-family:'DM Sans',sans-serif; font-size:11px;
  cursor:pointer; transition:all .2s;
}
.quick-btn:hover { border-color:rgba(91,45,142,0.3); color:var(--teal); }

/* ── SYMPTOM LOG ───────────────────────────────────── */
.symptom-form { padding:20px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
.form-group-inner label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; font-weight:500; display:block; margin-bottom:6px; }
.form-group-inner input, .form-group-inner textarea, .form-group-inner select {
  width:100%; padding:10px 12px;
  background:#f8f6fc;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--white);
  font-family:'DM Sans',sans-serif;
  font-size:13px; outline:none;
  transition:border-color .2s;
}
.form-group-inner input:focus, .form-group-inner textarea:focus, .form-group-inner select:focus { border-color:rgba(91,45,142,0.35); }
.form-group-inner select option { background:var(--navy2); }
.form-group-inner textarea { resize:vertical; min-height:70px; }

.intensity-slider { width:100%; accent-color:var(--teal); }
.slider-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-top:4px; }

.submit-btn {
  padding:11px 22px; border-radius:var(--radius-sm);
  background:var(--teal); border:none; color:#ffffff;
  font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600;
  cursor:pointer; transition:all .2s;
}
.submit-btn:hover { background:var(--teal2); transform:translateY(-1px); }

/* ── LOG ENTRIES ───────────────────────────────────── */
.log-entry {
  display:flex; gap:14px;
  padding:14px 20px; border-bottom:1px solid var(--border);
  transition:background .2s;
}
.log-entry:hover { background:rgba(91,45,142,0.03); }
.log-date { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); flex-shrink:0; width:70px; padding-top:2px; }
.log-content { flex:1; }
.log-title { font-size:13px; font-weight:600; color:var(--white); margin-bottom:3px; }
.log-desc { font-size:12px; color:var(--muted); line-height:1.5; }
.intensity-dot {
  width:28px; height:28px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; flex-shrink:0;
}
.int-low { background:rgba(46,216,138,0.15); color:var(--green); }
.int-med { background:rgba(255,181,71,0.15); color:var(--amber); }
.int-high { background:rgba(255,90,90,0.15); color:var(--red); }

/* ── CONSULTATION VIEW ─────────────────────────────── */
.consult-grid { display:grid; grid-template-columns:1fr 360px; gap:16px; height:calc(100vh - 56px - 48px - 24px); }
.consult-left { display:flex; flex-direction:column; gap:14px; overflow-y:auto; }
.consult-right { display:flex; flex-direction:column; gap:14px; overflow-y:auto; }

.transcript-area {
  flex:1; background:#f8f6fc; border:1px solid var(--border);
  border-radius:var(--radius); padding:20px;
  font-family:'DM Mono',monospace; font-size:12px;
  line-height:1.8; color:var(--muted); overflow-y:auto;
}
.transcript-line.doctor { color:#5B2D8E; font-weight:600; }
.transcript-line.patient { color:#F4694A; }
.transcript-speaker { font-weight:700; }
.cursor-blink { display:inline-block; width:2px; height:14px; background:var(--teal); animation:blink 1s infinite; vertical-align:middle; margin-left:3px; }
@keyframes blink { 0%,50% { opacity:1; } 51%,100% { opacity:0; } }

.rec-controls { display:flex; align-items:center; gap:10px; padding:14px 20px; background:#ffffff; border:1px solid var(--border); border-radius:var(--radius); }
.rec-btn {
  display:flex; align-items:center; gap:7px;
  padding:9px 18px; border-radius:6px;
  font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600;
  cursor:pointer; border:none; transition:all .2s;
}
.rec-btn.start { background:#F4694A; color:white; }
.rec-btn.stop { background:var(--muted2); color:white; }
.rec-btn.generate { background:var(--teal); color:#ffffff; }

.summary-block {
  background:#ffffff; border:1px solid var(--border);
  border-radius:var(--radius); overflow:hidden;
  box-shadow:0 1px 8px rgba(91,45,142,0.06);
}
.summary-section { padding:14px 18px; border-bottom:1px solid var(--border); }
.summary-section:last-child { border-bottom:none; }
.summary-section-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:8px; }
.summary-item { display:flex; gap:8px; align-items:flex-start; margin-bottom:6px; font-size:12px; color:var(--text); line-height:1.5; }
.summary-item::before { content:'·'; color:var(--teal); font-size:16px; line-height:1.2; flex-shrink:0; }

/* ── DRUG CHECKER ──────────────────────────────────── */
.drug-input-row { display:flex; gap:10px; padding:16px 20px; border-bottom:1px solid var(--border); }
.drug-input { flex:1; padding:10px 14px; background:#f8f6fc; border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--white); font-family:'DM Sans',sans-serif; font-size:13px; outline:none; }
.drug-input:focus { border-color:rgba(91,45,142,0.3); }
.drug-tag { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; background:rgba(91,45,142,0.08); border:1px solid rgba(91,45,142,0.18); border-radius:20px; font-size:11px; color:var(--teal); margin:4px; }
.drug-tag button { background:none; border:none; color:var(--teal); cursor:pointer; font-size:14px; line-height:1; }
.alert-item { display:flex; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border); align-items:flex-start; }
.alert-icon { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px; }
.alert-high { background:rgba(255,90,90,0.15); }
.alert-med { background:rgba(255,181,71,0.12); }
.alert-info { background:rgba(59,142,255,0.1); }
.alert-title { font-size:12px; font-weight:600; color:var(--white); margin-bottom:3px; }
.alert-desc { font-size:11px; color:var(--muted); line-height:1.5; }

/* ── PATIENT SUMMARY CARD ──────────────────────────── */
.patient-detail { display:grid; grid-template-columns:220px 1fr; gap:16px; }
.patient-profile-card { background:#ffffff; border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow: 0 1px 8px rgba(91,45,142,0.06); }
.patient-big-avatar { width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:white; margin:0 auto 12px; }
.patient-pname { font-size:15px; font-weight:600; color:var(--white); text-align:center; margin-bottom:3px; }
.patient-psub { font-size:11px; color:var(--muted); text-align:center; margin-bottom:16px; }
.patient-meta { border-top:1px solid var(--border); padding-top:14px; display:flex; flex-direction:column; gap:10px; }
.meta-row { display:flex; justify-content:space-between; }
.meta-label { font-size:11px; color:var(--muted); }
.meta-value { font-size:11px; color:var(--white); font-weight:500; text-align:right; }

.timeline { padding:0 20px; }
.timeline-item { display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--border); }

function selectRole(role, el) {
  currentRole = role;
  document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('login-email').value = role === 'doctor' ? 'dr.sarah@clinic.fr' : 'camille@gmail.com';
}

function quickDemo(role) { currentRole = role; doLogin(); }

function doLogin() {
  document.getElementById('login-screen').style.display = 'none';
  const app = document.getElementById('app');
  app.style.display = 'flex';
  setupUser();
  if (currentRole === 'doctor') navigateTo('dashboard');
  else navigateTo('p-home');
}

function logout() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  currentRole = 'doctor';
  document.querySelectorAll('.role-tab').forEach((t,i) => t.classList.toggle('active', i===0));
  document.getElementById('login-email').value = 'dr.sarah@clinic.fr';
}

  document.getElementById('sidebar-avatar').style.color = '#ffffff';

  document.getElementById('sidebar-role').textContent = isDoc ? 'General Practitioner' : 'Patient';

  const nav = isDoc ? doctorNav : patientNav;

    html += `<div class="nav-section"><div class="nav-section-label">${sec.section}</div>`;

function navigateTo(pageId) {
  currentPage = pageId;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navEl = document.getElementById('nav-' + pageId);
  if (navEl) navEl.classList.add('active');

  const titles = {
    dashboard:'Dashboard', consultation:'Consultation', 'patient-summary':'Patient Summary',
    'drug-checker':'Drug Checker', 'ai-assistant':'AI Assistant', 'all-patients':'All Patients',
    'p-home':'My Health', 'p-log':'Symptom Log', 'p-visits':'My Visits', 'p-ai':'Ask Relevo AI'
  };
  document.getElementById('topbar-title').textContent = titles[pageId] || pageId;

  const extras = document.getElementById('topbar-extras');
  extras.innerHTML = '';
  if (pageId === 'consultation') {
    extras.innerHTML = `<span class="topbar-badge recording" id="rec-indicator" style="display:none">RECORDING</span>`;
  }

  const area = document.getElementById('content-area');
  area.innerHTML = '';

  if (pageId === 'dashboard') renderDashboard();
  else if (pageId === 'consultation') renderConsultation();
  else if (pageId === 'patient-summary') renderPatientSummary();
  else if (pageId === 'drug-checker') renderDrugChecker();
  else if (pageId === 'ai-assistant') renderAIAssistant('doctor');
  else if (pageId === 'all-patients') renderAllPatients();

  else if (pageId === 'p-log') renderSymptomLog();

function toggleRecording() {
  isRecording = !isRecording;
  const btn = document.getElementById('rec-start-btn');
  const indicator = document.getElementById('rec-indicator');
  const timer = document.getElementById('rec-timer');

  if (isRecording) {
    btn.className = 'rec-btn stop';
    btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg> Stop';
    if (indicator) indicator.style.display = 'flex';
    recSeconds = 0;
    const transcript = document.getElementById('transcript-area');
    transcript.innerHTML = '';
    let lineIdx = 0;
    recordInterval = setInterval(() => {
      recSeconds++;
      const m = Math.floor(recSeconds/60).toString().padStart(2,'0');
      const s = (recSeconds%60).toString().padStart(2,'0');
      if (timer) timer.textContent = `Recording — ${m}:${s}`;
      if (lineIdx < transcriptLines.length && recSeconds % 4 === 1) {
        const l = transcriptLines[lineIdx++];
        transcript.innerHTML += `<div class="transcript-line ${l.role}" style="margin-bottom:10px;">
          <span class="transcript-speaker">${l.speaker}: </span>${l.text}
        </div>`;
        transcript.scrollTop = transcript.scrollHeight;
        if (lineIdx === transcriptLines.length) {
          transcript.innerHTML += '<div style="color:var(--muted);font-style:italic;margin-top:8px;">Listening<div class="cursor-blink"></div></div>';
        }
      }
    }, 1000);
  } else {
    clearInterval(recordInterval);
    btn.className = 'rec-btn start';
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg> Start Recording';
    if (indicator) indicator.style.display = 'none';
    if (timer) timer.textContent = `Stopped — ${Math.floor(recSeconds/60)}:${(recSeconds%60).toString().padStart(2,'0')} recorded`;
  }
}

// ══ AI ASSISTANT ═══════════════════════════

function renderAIAssistant(role) {
  const suggestions = role === 'doctor'
    ? ['Summarise Marcus T. history','Drug interaction: warfarin + aspirin','Guidelines for hypertension in elderly','Generate referral letter']
    : ['What does Propranolol do?','Is my headache normal with anxiety?','When should I call the doctor?','Explain my post-visit plan'];

  document.getElementById('content-area').innerHTML = `
  <div style="display:flex;flex-direction:column;height:calc(100vh - 56px - 48px);gap:0;">
    <div class="chat-messages" id="chat-messages">
      ${renderChatMessages()}
    </div>
    <div class="chat-input-area">
      <div class="chat-quick">${suggestions.map(s=>`<button class="quick-btn" onclick="sendQuick('${s}')">${s}</button>`).join('')}</div>
      <div class="chat-input-row">
        <textarea class="chat-textarea" id="chat-input" placeholder="Ask anything..." rows="1" onkeydown="chatEnter(event)"></textarea>
        <button class="chat-send" onclick="sendChat()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>`;
  scrollChat();
}

function renderChatMessages() {
  return chatHistory.map(m => {
    const isUser = m.role === 'user';
    return `<div class="msg ${isUser?'user':''}">
      ${!isUser?`<div class="msg-avatar" style="background:var(--teal);color:var(--navy);font-size:12px;font-weight:700;">AI</div>`:''}
      <div>
        <div class="msg-bubble">${m.text}</div>
        <div class="msg-time" style="text-align:${isUser?'right':'left'}">${m.time||''}</div>
      </div>
      ${isUser?`<div class="msg-avatar" style="background:var(--navy3);border:1px solid var(--border);">${currentRole==='doctor'?'👩‍⚕️':'👤'}</div>`:''}
    </div>`;
  }).join('');
}

function scrollChat() {
  setTimeout(() => {
    const el = document.getElementById('chat-messages');
    if (el) el.scrollTop = el.scrollHeight;
  }, 50);
}

function chatEnter(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } }

function sendQuick(text) {
  document.getElementById('chat-input').value = text;
  sendChat();
}

async function sendChat() {
  const inp = document.getElementById('chat-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';

  const now = new Date().toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  chatHistory.push({ role:'user', text, time:now });

  // Show typing indicator
  chatHistory.push({ role:'assistant', text:'<div class="typing-dots"><span></span><span></span><span></span></div>', time:'' });
  renderAIAssistant(currentRole);

  try {
    const systemPrompt = currentRole === 'doctor'
      ? `You are Relevo AI, a clinical assistant for Dr. Sarah M., a General Practitioner in Paris. You help with patient summaries, drug interactions (always mention to consult EMA guidelines), clinical decision support, and documentation. Be concise, professional, evidence-based. Mention HDS compliance when relevant. Current patient context: Camille F. (26, anxiety + migraines), Marcus T. (52, hypertension + fracture).`
      : `You are Relevo AI, a friendly health companion for Camille, a 26-year-old patient managing anxiety and migraines in Paris. Help her understand her symptoms, medications (Sumatriptan, Propranolol, Sertraline), and care plan. Be warm, simple, and non-alarmist. Always recommend contacting Dr. Sarah for medical decisions. Never diagnose.`;

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:600,
        system: systemPrompt,
        messages: chatHistory.filter(m => m.role !== 'assistant' || !m.text.includes('typing-dots')).slice(-10).map(m => ({
          role: m.role,
          content: m.text
        }))
      })
    });
    const data = await resp.json();
    const reply = data.content?.[0]?.text || 'I apologise, I could not process that. Please try again.';

    // Remove typing indicator and add real reply
    chatHistory = chatHistory.filter(m => !m.text.includes('typing-dots'));
    chatHistory.push({ role:'assistant', text: reply.replace(/\n/g,'<br>'), time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) });
  } catch(e) {
    chatHistory = chatHistory.filter(m => !m.text.includes('typing-dots'));
    chatHistory.push({ role:'assistant', text:'I\'m here to help! (Note: AI connection unavailable in demo mode — but in production Relevo AI would answer your question in real time.)', time:now });
  }

  renderAIAssistant(currentRole);
}
